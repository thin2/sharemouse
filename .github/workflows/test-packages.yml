name: Test packages

# Explicit artifact builds only. This workflow never creates a release or tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native build dependencies
        run: brew install gtk4 libadwaita librsvg
      - uses: Swatinem/rust-cache@v2
      - name: Build, test and package
        run: |
          cargo test --workspace --locked
          python3 scripts/package-macos.py
      - uses: actions/upload-artifact@v6
        with:
          name: Sharemouse-macos-arm64
          path: |
            target/packages/macos-arm64/Sharemouse-macos-arm64.zip
            target/packages/macos-arm64/Sharemouse-macos-arm64.build.json

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        id: gtk
        with:
          path: c:/gtk-build/gtk/x64/release
          key: gtk-windows-build
      - name: Build GTK when not cached
        if: steps.gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install gvsbuild
          gvsbuild build --vs-ver=vs2026 --msys-dir=C:\msys64 gtk4 libadwaita librsvg
      - name: Configure GTK
        shell: pwsh
        run: |
          "PKG_CONFIG=C:\gtk-build\gtk\x64\release\bin\pkgconf.exe" >> $env:GITHUB_ENV
          "C:\gtk-build\gtk\x64\release\bin" >> $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - uses: Swatinem/rust-cache@v2
      - name: Compile, test and lint Windows code
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer and portable runtime
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -GtkPrefix 'C:\gtk-build\gtk\x64\release' -VcRedistDir $env:VCToolsRedistDir
      - uses: actions/upload-artifact@v6
        with:
          name: Sharemouse-windows-x64
          path: |
            target/packages/windows-x64/Sharemouse-windows-x64.zip
            target/packages/windows-x64/Sharemouse-windows-x64-setup.exe
