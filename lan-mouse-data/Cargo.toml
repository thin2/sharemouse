[package]
name = "lan-mouse-data"
description = "Authenticated reliable transport for files, messages and clipboard data"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[dependencies]
rustls = { version = "0.23.12", default-features = false, features = [
    "std",
    "ring",
    "tls12",
] }
rustls-pemfile = "2"
pem = "3.0.6"
log = "0.4.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
sha2 = "0.10.8"
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
    "ring",
    "tls12",
] }

[dev-dependencies]
rcgen = "0.13.1"
tokio = { version = "1.32.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.148"
