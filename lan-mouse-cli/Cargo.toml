[package]
name = "lan-mouse-cli"
description = "CLI Frontend for lan-mouse"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[dependencies]
futures = "0.3.30"
lan-mouse-ipc = { path = "../lan-mouse-ipc", version = "0.3.0" }
clap = { version = "4.4.11", features = ["derive"] }
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "rt",
] }

# Right-click integration writes per-user registry values.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.2", features = ["Win32_System_Registry", "Win32_Security"] }
